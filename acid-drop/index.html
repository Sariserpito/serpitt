<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acid Drop · Serpitt</title>
<meta name="description" content="Listen to Acid Drop by Serpitt on your favourite platform.">
<meta property="og:title" content="Acid Drop · Serpitt">
<!-- Link previews (WhatsApp, X, Telegram) need an absolute image URL. -->
<meta property="og:image" content="https://sariserpito.github.io/serpitt/acid-drop/cover.jpg">
<meta property="og:url" content="https://sariserpito.github.io/serpitt/acid-drop/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg: #f4f2f7; --card: #ffffff; --text: #17141c; --muted: #6b6475; --line: #e2dde9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0d13; --card: #1b1822; --text: #f1edf6; --muted: #a39cae; --line: #2c2836; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  h1 { margin: 20px 0 2px; font-size: 26px; }
  .artist { margin: 0 0 22px; color: var(--muted); }
  a.service {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; margin-bottom: 10px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-weight: 600;
  }
  a.service:hover, a.service:focus-visible { border-color: var(--muted); }
  a.service span { color: var(--muted); font-weight: 500; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="cover.jpg" alt="Acid Drop cover art">
  <h1>Acid Drop</h1>
  <p class="artist">Serpitt · Off The Gravity</p>
  <div id="services"></div>
</main>
<script>
  // Fill in each link; one left empty is not shown.
  const SERVICES = [
    ["spotify", "Spotify", "https://open.spotify.com/album/01jMUVLdfv252pJLoLJQjG"],
    ["apple-music", "Apple Music", "https://music.apple.com/us/album/acid-drop-single/1883122538"],
    ["youtube", "YouTube", "https://www.youtube.com/watch?v=WxXYSuDV-MU"],
    ["bandcamp", "Bandcamp", "https://serpitt.bandcamp.com/track/acid-drop"],
  ];
  // GoatCounter site code (the "xyz" in xyz.goatcounter.com); empty: nothing is counted.
  const GOATCOUNTER = "serpitt";

  const list = document.getElementById("services");
  for (const [id, name, url] of SERVICES) {
    if (!url) continue;
    const a = document.createElement("a");
    a.className = "service";
    a.href = url;
    a.rel = "noopener";
    // Counted as an event per platform; the page view itself carries utm_source (the app sends "pittplayer").
    a.dataset.goatcounterClick = "acid-drop/" + id;
    a.dataset.goatcounterTitle = name;
    a.innerHTML = name + " <span>Play →</span>";
    list.appendChild(a);
  }
  if (GOATCOUNTER) {
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = "https://" + GOATCOUNTER + ".goatcounter.com/count";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
