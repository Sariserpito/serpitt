<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Serpitt</title>
<style>
  :root { --bg: #f4f2f7; --text: #17141c; --muted: #6b6475; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0d13; --text: #f1edf6; --muted: #a39cae; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; text-align: center; }
  a { color: var(--muted); }
</style>
</head>
<body>
<p id="msg">Serpitt</p>
<script>
  // ?to=<id> counts one visit to /go/<id> and goes on to the page; utm_source (the app sends "pittplayer") is the referrer.
  const TARGETS = {
    bandcamp: "https://serpitt.bandcamp.com/",
    youtube: "https://www.youtube.com/@Serpitt",
    spotify: "https://open.spotify.com/artist/3olPrhCeikfOp9hNVO0rWY",
  };
  // GoatCounter site code (the "xyz" in xyz.goatcounter.com); empty: nothing is counted.
  const GOATCOUNTER = "serpitt";

  // Android: their apps (Chrome kept these https links in the browser); not installed, the web page.
  const APPS = { youtube: "com.google.android.youtube", bandcamp: "com.bandcamp.android" };
  const appUrl = (id, url) => {
    if (!APPS[id] || !/Android/i.test(navigator.userAgent)) return url;
    const u = new URL(url);
    return "intent://" + u.host + u.pathname + u.search + "#Intent;scheme=https;package=" + APPS[id] +
      ";S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
  };

  const q = new URLSearchParams(location.search);
  const id = q.get("to");
  const target = TARGETS[id] && appUrl(id, TARGETS[id]);
  let gone = false;
  const go = () => { if (!gone) { gone = true; location.replace(target); } };
  if (!target) {
    document.getElementById("msg").innerHTML = '<a href="../">Serpitt</a>';
  } else {
    document.getElementById("msg").innerHTML = '<a href="' + target + '">' + TARGETS[id] + "</a>";
    if (GOATCOUNTER) {
      const ref = [q.get("utm_source"), q.get("utm_campaign")].filter(Boolean).join("/");
      const pixel = new Image();
      pixel.onload = pixel.onerror = go;
      pixel.src = "https://" + GOATCOUNTER + ".goatcounter.com/count?p=" + encodeURIComponent("/go/" + id) +
        "&t=" + encodeURIComponent(id) + "&r=" + encodeURIComponent(ref) + "&rnd=" + Math.random().toString(36).slice(2);
      setTimeout(go, 800); // a slow or blocked counter never holds the visitor
    } else {
      go();
    }
  }
</script>
</body>
</html>
